
name: Ruff Python Code Analysis

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ruff:
    name: Scan Python Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Ruff
        run: python -m pip install ruff==0.14.5

      - name: Scan all Python files
        run: ruff check . --output-format github
